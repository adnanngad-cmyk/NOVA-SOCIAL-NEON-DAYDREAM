const log=x=>document.querySelector("#log").textContent+=x+"\n";
const rnd=n=>{let a=new Uint8Array(n);crypto.getRandomValues(a);return btoa(String.fromCharCode(...a)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")};
async function sha(s){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(s))}
function b64(b){return btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
async function auth(){
 let v=rnd(96), st=rnd(32);sessionStorage.v=v;sessionStorage.st=st;
 let ch=b64(await sha(v));
 let p=new URLSearchParams({response_type:"code",client_id:CLIENT_ID,scope:"playlist-modify-private",redirect_uri:REDIRECT_URI,state:st,code_challenge_method:"S256",code_challenge:ch});
 location.href="https://accounts.spotify.com/authorize?"+p;
}
async function api(token,url,opt={}){
 let h=Object.assign({Authorization:"Bearer "+token},opt.headers||{});
 let r=await fetch(url,Object.assign({},opt,{headers:h}));
 if(!r.ok)throw Error(r.status+" "+await r.text()); return r.status===204?null:r.json();
}
async function token(code){
 let b=new URLSearchParams({grant_type:"authorization_code",code,redirect_uri:REDIRECT_URI,client_id:CLIENT_ID,code_verifier:sessionStorage.v});
 let r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:b});
 if(!r.ok)throw Error(await r.text());return (await r.json()).access_token;
}
async function search(t,a){
 let p=new URLSearchParams({q:`track:"${t}" artist:"${a}"`,type:"track",limit:"10",market:"ID"});
 let d=await api(T,"https://api.spotify.com/v1/search?"+p),x=d.tracks.items;
 if(!x.length)return null;
 let n=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,""),na=n(a),nt=n(t);
 return x.sort((u,v)=>score(v)-score(u))[0];
 function score(i){let sa=n(i.artists.map(x=>x.name).join(" ")),st=n(i.name),z=(sa.includes(na)||na.includes(sa)?5:0);return z+(st===nt?5:(st.includes(nt)||nt.includes(st)?3:0))}
}
async function run(){
 document.querySelector("#go").disabled=true;
